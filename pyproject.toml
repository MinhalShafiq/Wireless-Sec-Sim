[project]
name = "wireless-sec-sim"
version = "0.1.0"
description = "AI-driven secure wireless network design and optimization platform"
requires-python = ">=3.10,<3.13"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
